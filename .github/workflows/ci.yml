name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4

      # Runs the generator first, then the golden test and the C suite.
      - name: C tests
        run: make test CC=${{ matrix.cc }}

      - name: C++ tests
        run: make test-cpp CXX=${{ matrix.cxx }}

      # The header must compile without warnings under strict flags.
      - name: Strict warnings
        run: make strict CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}

      # attractor.h is partly generated: the committed file must match the generator.
      - name: Header is in sync with the generator
        run: git diff --exit-code -- attractor.h

  sanitizers:
    name: ubuntu-latest / clang / ASan + UBSan
    runs-on: ubuntu-latest
    env:
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=undefined -g
    steps:
      - uses: actions/checkout@v4

      - name: C tests
        run: make test CC=clang CFLAGS="-Wall -Wextra -Wno-unused-parameter -std=c11 $SANITIZE"

      - name: C++ tests
        run: make test-cpp CXX=clang++ CXXFLAGS="-Wall -Wextra -Wno-unused-parameter -std=c++17 $SANITIZE"

  windows:
    name: windows-latest / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # The Makefile targets Unix tools, so MSVC builds the suite directly. The golden test is
      # skipped here: its expected output has Unix paths and line endings.
      - name: C tests
        shell: cmd
        run: |
          cl /nologo /std:c11 /W3 /D_CRT_SECURE_NO_WARNINGS /Fe:test.exe tests\*.c || exit /b 1
          test.exe

      - name: C++ tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /TP /W3 /D_CRT_SECURE_NO_WARNINGS /Fe:test-cpp.exe tests\*.c || exit /b 1
          test-cpp.exe

  mingw:
    name: windows-latest / ${{ matrix.msystem }} / gcc
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # UCRT64 links the Universal CRT, MINGW64 the legacy msvcrt.dll.
          - { msystem: UCRT64, toolchain: mingw-w64-ucrt-x86_64-gcc }
          - { msystem: MINGW64, toolchain: mingw-w64-x86_64-gcc }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make diffutils ${{ matrix.toolchain }}

      # The committed header is used as is: mark the generator as already run, so make does not
      # need Node.js here. The unix job checks that the header matches the generator.
      - name: Skip the generator
        run: mkdir -p bin && touch bin/.generated

      - name: C tests
        run: make test CC=gcc

      - name: C++ tests
        run: make test-cpp CXX=g++

      # GCC checks printf formats against the Microsoft dialect here, unlike on the other jobs.
      - name: Strict warnings
        run: make strict CC=gcc CXX=g++
